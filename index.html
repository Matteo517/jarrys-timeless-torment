<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarry's Timeless Torment</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap');

    * { box-sizing: border-box; }

    body {
      background: #050505;
      color: #fff;
      font-family: 'VT323', monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      z-index: 99;
    }

    nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 20px 40px;
      gap: 15px;
      z-index: 10;
    }

    .nav-btn {
      background: linear-gradient(180deg, #7a0000 0%, #2b0000 100%);
      color: #fff;
      border: 2px solid #ff2222;
      padding: 8px 22px;
      font-family: 'Creepster', cursive;
      font-size: 1.6rem;
      cursor: pointer;
      text-shadow: 2px 2px #000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .nav-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
    }

    .logo-img {
      max-width: 450px;
      width: 90%;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
      margin-bottom: 20px;
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    .character-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      width: 100%;
      margin: 20px 0;
    }

    .char-card {
      text-align: center;
      cursor: pointer;
    }

    .char-img {
      height: 380px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9));
      transition: transform 0.3s, filter 0.3s;
    }

    .char-card:hover .char-img {
      transform: scale(1.05);
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
    }

    .char-name {
      font-family: 'Creepster', cursive;
      font-size: 2.2rem;
      color: #ff3333;
      margin-top: 10px;
      text-shadow: 2px 2px #000;
    }

    .player-card {
      width: 100%;
      max-width: 600px;
      background: rgba(20, 0, 0, 0.85);
      border: 2px solid #8b0000;
      padding: 15px 25px;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      text-align: center;
      margin-top: 20px;
    }

    .track-title {
      font-size: 1.8rem;
      color: #ff3333;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    audio { width: 100%; accent-color: #ff1a1a; }

    /* ESTILOS WIKI */
    .wiki-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .wiki-content {
      background: #121212;
      border: 2px solid #7a0000;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 25px;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
      color: #ddd;
    }

    .close-wiki {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 2.5rem;
      color: #ff3333;
      cursor: pointer;
      font-family: sans-serif;
    }

    .wiki-header {
      font-family: 'Creepster', cursive;
      font-size: 3rem;
      color: #ff3333;
      border-bottom: 2px solid #7a0000;
      margin-bottom: 20px;
    }

    .wiki-body {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .wiki-text {
      flex: 1;
      min-width: 280px;
      font-size: 1.4rem;
      line-height: 1.4;
    }

    .wiki-quote {
      background: #1c1c1c;
      border-left: 4px solid #ff3333;
      padding: 10px 15px;
      margin-bottom: 15px;
      font-style: italic;
    }

    .wiki-infobox {
      width: 300px;
      background: #1a0505;
      border: 2px solid #8b0000;
      padding: 15px;
      text-align: center;
    }

    .infobox-title {
      background: #7a0000;
      font-family: 'Creepster', cursive;
      font-size: 1.8rem;
      padding: 5px;
      margin-bottom: 10px;
    }

    .infobox-tabs {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 10px;
    }

    .tab-btn {
      background: #2b0000;
      color: #aaa;
      border: 1px solid #7a0000;
      padding: 5px 10px;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      flex: 1;
    }

    .tab-btn.active {
      background: #7a0000;
      color: #fff;
      font-weight: bold;
    }

    .infobox-img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      margin-bottom: 10px;
      border: 1px solid #333;
      background: #000;
    }

    .infobox-data {
      text-align: left;
      font-size: 1.2rem;
    }

    .infobox-row {
      margin-bottom: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    .infobox-label { color: #ff6666; font-weight: bold; }
  </style>
</head>
<body>

  <audio id="bg-music" loop>
    <source src="menu.ogg" type="audio/ogg">
  </audio>

  <audio id="select-sound">
    <source src="select.wav" type="audio/wav">
  </audio>

  <audio id="click-sound">
    <source src="click.wav" type="audio/wav">
  </audio>

  <nav>
    <button class="nav-btn" onclick="showSection('main')">Main</button>
    <button class="nav-btn" onclick="showSection('credits')">Credits</button>
    <button class="nav-btn" onclick="showSection('teasers')">Teasers</button>
  </nav>

  <main id="content">
    <img src="JarrysTimelessTormentLogo.png" alt="Logo" class="logo-img">

    <div class="character-container">
      <div class="char-card" onclick="openWiki('kelvin')">
        <img src="Kelvin.png" alt="Kelvin" class="char-img">
        <div class="char-name">KELVIN</div>
      </div>
      <div class="char-card" onclick="openWiki('jarry')">
        <img src="Jarry.png" alt="Jarry" class="char-img">
        <div class="char-name">JARRY</div>
      </div>
    </div>

    <div class="player-card">
      <div class="track-title" id="track-name">--> TORMENT <--</div>
      <audio controls id="audio-player">
        <source src="TormentFNF.mp3" type="audio/mpeg">
      </audio>
    </div>
  </main>

  <div id="wiki-modal" class="wiki-modal">
    <div class="wiki-content">
      <span class="close-wiki" onclick="closeWiki()">&times;</span>
      <div id="wiki-header" class="wiki-header">Nombre</div>
      <div class="wiki-body">
        <div class="wiki-text" id="wiki-text"></div>

        <div class="wiki-infobox">
          <div class="infobox-title" id="info-title">Nombre</div>
          <div class="infobox-tabs" id="infobox-tabs"></div>
          <img id="info-img" src="" class="infobox-img">
          <div class="infobox-data" id="info-data"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bgMusic = document.getElementById('bg-music');
    bgMusic.volume = 0.2;

    function startBgMusic() {
      bgMusic.play().then(() => {
        document.removeEventListener('click', startBgMusic);
      }).catch(err => console.log("Autoplay bloqueado:", err));
    }
    document.addEventListener('click', startBgMusic);

    const fnfPlayer = document.getElementById('audio-player');
    if (fnfPlayer) {
      fnfPlayer.onplay = () => bgMusic.pause();
      fnfPlayer.onpause = () => bgMusic.play();
    }

    const selectSound = document.getElementById('select-sound');
    selectSound.volume = 0.5;

    function playSelectSound() {
      selectSound.currentTime = 0;
      selectSound.play().catch(e => {});
    }

    document.addEventListener('mouseover', (e) => {
      const target = e.target.closest('.nav-btn, .char-card, .tab-btn, .close-wiki');
      if (target && !target.dataset.hovered) {
        target.dataset.hovered = "true";
        playSelectSound();
      }
    });

    document.addEventListener('mouseout', (e) => {
      const target = e.target.closest('.nav-btn, .char-card, .tab-btn, .close-wiki');
      if (target) {
        delete target.dataset.hovered;
      }
    });

    const clickSound = document.getElementById('click-sound');
    clickSound.volume = 0.6;

    function playClickSound() {
      clickSound.currentTime = 0;
      clickSound.play().catch(e => {});
    }

    document.addEventListener('click', () => {
      playClickSound();
    });

    const wikiData = {
      kelvin: {
        name: "Kelvin",
        images: [
          { label: "Before the torment", src: "Kelvin.png" },
          { label: "After the torment", src: "Kelvin after the torment.png" }
        ],
        quote: '"Happiness is a mask..."',
        desc: "El padre de Jarry, es una persona de carácter serio, triste y melancólico. Su vida fue larga, pero su día final fue... EL TORMENTO, murió por las manos de su propio hijo, le arrancó el rostro, le cortó el brazo izquierdo y le rompió los dedos de la mano derecha.",
        species: "Humano",
        status: "Muerto",
        role: "Padre de Jarry / Antagonista"
      },
      jarry: {
        name: "Jarry",
        images: [
          { label: "EL TORMENTOR", src: "JarryosTormentor.jpg" },
          { label: "Jarry", src: "Jarry.png" }
        ],
        quote: '"¡NO SOY UN MONSTRUO... SOLO SOY UN NIÑO QUE QUERÍA SUS ROBUX, NO ES MI CULPA QUE LA GENTE SEA TAN IMBÉCIL CONMIGO!"',
        desc: "El hijo de Kelvin y EL MISMO DIABLO ENCARNADO EN UN CUERPO QUE NO PUEDE CONTROLAR, Jarry es el asesino de todo el Tormento. Mató a todos dentro de el, incluyendo a su propio padre, solo quiere venganza por no obtener los robux que el quiso y no le importa matar a el mismisimo creador del todo para obtenerlos...",
        species: "Humano / Demonio",
        status: "Vivo",
        role: "El TORMENTADOR"
      }
    };

    function openWiki(charKey) {
      const data = wikiData[charKey];
      if (!data) return;

      document.getElementById('wiki-header').innerText = data.name;
      document.getElementById('info-title').innerText = data.name;

      const tabsContainer = document.getElementById('infobox-tabs');
      tabsContainer.innerHTML = '';

      if (data.images.length > 1) {
        tabsContainer.style.display = 'flex';
        data.images.forEach((imgObj, index) => {
          const btn = document.createElement('button');
          btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
          btn.innerText = imgObj.label;
          btn.onclick = () => switchTab(btn, imgObj.src);
          tabsContainer.appendChild(btn);
        });
      } else {
        tabsContainer.style.display = 'none';
      }

      document.getElementById('info-img').src = data.images[0].src;

      document.getElementById('wiki-text').innerHTML = `
        <div class="wiki-quote">${data.quote}</div>
        <p>${data.desc}</p>
      `;

      document.getElementById('info-data').innerHTML = `
        <div class="infobox-row"><span class="infobox-label">Especie:</span> ${data.species}</div>
        <div class="infobox-row"><span class="infobox-label">Estado:</span> ${data.status}</div>
        <div class="infobox-row"><span class="infobox-label">Rol:</span> ${data.role}</div>
      `;

      document.getElementById('wiki-modal').style.display = 'flex';
    }

    function switchTab(clickedBtn, imgSrc) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      clickedBtn.classList.add('active');
      document.getElementById('info-img').src = imgSrc;
    }

    function closeWiki() {
      document.getElementById('wiki-modal').style.display = 'none';
    }

    function showSection(section) {
      const content = document.getElementById('content');
      if (section === 'main') {
        location.reload();
      } else if (section === 'credits') {
        content.innerHTML = `
          <h1 style="font-family:'Creepster'; font-size: 3.5rem; color:#ff1a1a;">CRÉDITOS</h1>
          <p style="font-size: 2rem; margin-bottom: 5px;"><strong>Director:</strong> Matteo</p>
          <p style="font-size: 2rem;"><strong>Artistas:</strong> Matteo & dniboom</p>
          <p style="font-size: 1.8rem; color:#888; margin-top: 20px;">Jarry's Timeless Torment Team</p>
        `;
      } else if (section === 'teasers') {
        content.innerHTML = `
          <h1 style="font-family:'Creepster'; font-size: 3.5rem; color:#ff1a1a;">TEASERS</h1>
          <p style="font-size: 2rem;">--> Próximamente más revelaciones <--</p>
        `;
      }
    }
  </script>

</body>
</html>
